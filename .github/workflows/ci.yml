name: Offline lifecycle regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          check-latest: false
      - name: Semantic and negative-control tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce CLI flow and assert expected failures
        run: python scripts/verify_demo.py --out work/ci-verification
